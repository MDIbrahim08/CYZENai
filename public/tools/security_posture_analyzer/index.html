<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posture Analyzer</title>
    <script type="module" crossorigin src="assets/index-BvAz94CA.js"></script>
    <link rel="stylesheet" crossorigin href="assets/index-BgZf7nrz.css">
    <script>
      (function() {
        // Auto-login by setting mock token
        localStorage.setItem('token', 'local_mock_token');
        sessionStorage.setItem('token', 'local_mock_token');

        var originalFetch = window.fetch;
        window.fetch = async function() {
          var url = arguments[0];
          if (typeof url === 'string' || url instanceof URL) {
             url = url.toString();
             if (url.includes('/api/auth/me')) {
               return new Response(JSON.stringify({ success: true, data: { user: { id: "local", name: "User", role: "user" } } }), {
                 status: 200, headers: { 'Content-Type': 'application/json' }
               });
             }
             if (url.includes('/api/auth/login') || url.includes('/api/auth/register')) {
               return new Response(JSON.stringify({ success: true, token: "local_mock_token" }), {
                 status: 200, headers: { 'Content-Type': 'application/json' }
               });
             }
             if (url.includes('/api/assessments/start')) {
               return new Response(JSON.stringify({ success: true, data: { sessionId: "sess_" + Date.now() } }), {
                 status: 200, headers: { 'Content-Type': 'application/json' }
               });
             }
             if (url.includes('/submit')) {
               return new Response(JSON.stringify({ 
                    success: true, 
                    data: { 
                      score: 75, 
                      details: { accessControl: 80, dataProtection: 70, networkSecurity: 85, incidentResponse: 65 },
                      recommendations: ["Enable MFA on all critical accounts", "Implement regular data backups", "Use a password manager"]
                    } 
                  }), {
                 status: 200, headers: { 'Content-Type': 'application/json' }
               });
             }
             if (url.includes('/api/assessments/') && arguments[1] && arguments[1].method === "GET") {
                return new Response(JSON.stringify({ 
                    success: true, 
                    data: { 
                      score: 75, 
                      details: { accessControl: 80, dataProtection: 70, networkSecurity: 85, incidentResponse: 65 },
                      recommendations: ["Enable MFA on all critical accounts", "Implement regular data backups"]
                    } 
                  }), {
                 status: 200, headers: { 'Content-Type': 'application/json' }
               });
             }
          }
          return originalFetch.apply(this, arguments);
        };

        // Also keep MockXHR just in case
        var originalXHR = window.XMLHttpRequest;
        function MockXHR() {
          var xhr = new originalXHR();
          var method, url;
          var proxy = {
            open: function(m, u) { method = m.toUpperCase(); url = u; xhr.open.apply(xhr, arguments); },
            send: function(body) {
              if (url.includes('/api/auth/me')) {
                Object.defineProperty(proxy, 'status', { value: 200 });
                Object.defineProperty(proxy, 'readyState', { value: 4 });
                Object.defineProperty(proxy, 'responseText', { value: JSON.stringify({ success: true, data: { user: { id: "local", name: "User", role: "user" } } }) });
                setTimeout(() => { if (proxy.onload) proxy.onload(); if (proxy.onreadystatechange) proxy.onreadystatechange(); }, 10);
                return;
              }
              if (url.includes('/api/auth/login') || url.includes('/api/auth/register')) {
                Object.defineProperty(proxy, 'status', { value: 200 });
                Object.defineProperty(proxy, 'readyState', { value: 4 });
                Object.defineProperty(proxy, 'responseText', { value: JSON.stringify({ success: true, token: "local_mock_token" }) });
                setTimeout(() => { if (proxy.onload) proxy.onload(); if (proxy.onreadystatechange) proxy.onreadystatechange(); }, 10);
                return;
              }
              xhr.send.apply(xhr, arguments);
            },
            setRequestHeader: function() { xhr.setRequestHeader.apply(xhr, arguments); }
          };
          for (var prop in xhr) { if (!(prop in proxy) && typeof xhr[prop] === 'function') proxy[prop] = xhr[prop].bind(xhr); }
          return proxy;
        }
        window.XMLHttpRequest = MockXHR;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
