<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posture Analyzer</title>
    <script type="module" crossorigin src="assets/index-BvAz94CA.js"></script>
    <link rel="stylesheet" crossorigin href="assets/index-BgZf7nrz.css">
    <script>
      (function() {
        // Force React Router to always start at root in the iframe
        window.history.replaceState(null, '', '/');

        // Auto-login by setting mock token
        localStorage.setItem('token', 'local_mock_token');
        sessionStorage.setItem('token', 'local_mock_token');
        localStorage.setItem('supabase.auth.token', JSON.stringify({currentSession: {access_token: 'mock'}}));

        function getMockResponse(url, method, body) {
          url = url.toString();
          method = method ? method.toUpperCase() : 'GET';
          
          if (url.includes('/auth/v1/token') || url.includes('/api/auth/login') || url.includes('sign-in') || url.includes('/api/auth/register')) {
            return {
              status: 200,
              data: { 
                success: true,
                access_token: "local_mock_token", 
                token: "local_mock_token",
                user: { id: "local", email: "user@example.com", name: "User", role: "user" } 
              }
            };
          }
          if (url.includes('/auth/v1/user') || url.includes('/api/auth/me')) {
            return {
              status: 200,
              data: { 
                success: true,
                data: { user: { id: "local", name: "User", role: "user" } },
                id: "local", email: "user@example.com", role: "authenticated", user: { id: "local", name: "User", role: "user" } 
              }
            };
          }
          
          if (url.includes('/api/assessments/start')) {
            const mockQuestions = [
              {
                id: "Q_AUTH_001",
                text: "How do users authenticate into your application?",
                category: "Authentication",
                options: [
                  { text: "No authentication — it is fully public" },
                  { text: "Username and password only" },
                  { text: "Username and password with optional MFA" },
                  { text: "MFA is enforced for all users" }
                ]
              },
              {
                id: "Q_DATA_001",
                text: "How is sensitive user data (like passwords) stored in your database?",
                category: "Data Protection",
                options: [
                  { text: "Plain text or simple encoding (e.g., Base64)" },
                  { text: "Hashed using old algorithms (MD5, SHA-1)" },
                  { text: "Hashed with modern algorithms (bcrypt, Argon2) and salted" }
                ]
              },
              {
                id: "Q_NET_001",
                text: "Is all communication between client and server encrypted?",
                category: "Network Security",
                options: [
                  { text: "No, it uses plain HTTP" },
                  { text: "Partial — some pages use HTTP, some HTTPS" },
                  { text: "Yes, HTTPS is strictly enforced with HSTS" }
                ]
              },
              {
                id: "Q_API_002",
                text: "How do you validate and sanitize user input on the backend?",
                category: "API Security",
                options: [
                  { text: "No validation — we trust client-side validation" },
                  { text: "Basic checks but no schema validation library" },
                  { text: "Strict schema validation (e.g., Zod, Joi) on all endpoints" }
                ]
              },
              {
                id: "Q_CLOUD_001",
                text: "How are secrets (API keys, DB connection strings) managed?",
                category: "Cloud Security",
                options: [
                  { text: "Hardcoded directly in source code" },
                  { text: "Stored in .env files committed to version control" },
                  { text: ".env files excluded from git, used locally" },
                  { text: "Dedicated secret manager (AWS Secrets Manager, HashiCorp Vault)" }
                ]
              },
              {
                id: "Q_DEP_001",
                text: "How often do you update your software dependencies?",
                category: "Supply Chain",
                options: [
                  { text: "Rarely or never" },
                  { text: "Occasionally, when a major issue is reported" },
                  { text: "Regularly with automated scanning tools (Snyk, Dependabot)" }
                ]
              },
              {
                id: "Q_BCP_001",
                text: "How is your critical data backed up?",
                category: "Business Continuity",
                options: [
                  { text: "No formal backup process" },
                  { text: "Automated backups, but never tested for recovery" },
                  { text: "Automated, off-site backups with regular restoration drills" }
                ]
              },
              {
                id: "Q_DEV_003",
                text: "How do you manage your passwords?",
                category: "Endpoint Security",
                options: [
                  { text: "I reuse the same password across multiple sites" },
                  { text: "I try to use different passwords but store them in a text file" },
                  { text: "I use a password manager (Bitwarden, 1Password, etc.)" }
                ]
              }
            ];

            return {
              status: 200,
              data: { 
                success: true, 
                data: { 
                  sessionId: "sess_" + Date.now(),
                  questionCount: mockQuestions.length,
                  questions: mockQuestions
                } 
              }
            };
          }
          
          if (url.includes('/rest/v1/')) {
            return {
              status: 200,
              data: [{
                 id: "1", score: 85, title: "Initial Assessment",
                 created_at: new Date().toISOString(),
                 details: { accessControl: 80, dataProtection: 90, networkSecurity: 85, incidentResponse: 80 }
              }]
            };
          }

          if (url.includes('api.groq.com') || url.includes('/functions/v1/') || url.includes('openai.com')) {
             const mockPlan = `## Analysis Complete\nYour security posture is generally good, but you need to enable MFA and secure your EU/UK data collection endpoints immediately to comply with GDPR.`;
             return {
               status: 200,
               data: {
                 choices: [{ message: { content: mockPlan } }],
                 success: true,
                 data: {
                     score: 75,
                     details: { accessControl: 80, dataProtection: 70, networkSecurity: 85, incidentResponse: 65 },
                     recommendations: ["Enable MFA on all critical accounts", "Implement regular data backups", "Use a password manager"]
                 }
               }
             };
          }

          let score = 78;
          let calculatedRisk = "medium";
          let calculatedMaturity = "Intermediate";
          let calculatedFindings = [];
          
          let authScore = 6.0;
          let dataScore = 7.5;
          let netScore = 8.0;
          let apiScore = 6.5;
          let cloudScore = 5.0;
          let supplyScore = 8.0;
          let bcpScore = 7.0;
          let devScore = 6.0;

          if (body && body.answers && Array.isArray(body.answers)) {
            let totalMax = 0;
            let totalObtained = 0;
            
            const questionData = {
              "Q_AUTH_001": {
                category: "Authentication",
                options: [
                  { score: 0, severity: "critical", title: "No Authentication Mechanism", desc: "The application is fully public without any authentication, exposing all data." },
                  { score: 2, severity: "critical", title: "Missing MFA Protection", desc: "Access is secured with username and password only, leaving it highly vulnerable to brute force and credential stuffing attacks." },
                  { score: 6, severity: "warning", title: "Optional MFA Policy", desc: "MFA is only optional for users, exposing accounts that choose not to enable it." },
                  { score: 10, severity: null }
                ]
              },
              "Q_DATA_001": {
                category: "Data Protection",
                options: [
                  { score: 0, severity: "critical", title: "Plaintext Password Storage", desc: "Passwords are stored in clear text or trivial encoding, exposing credentials completely in case of database access." },
                  { score: 3, severity: "critical", title: "Obsolete Cryptographic Hashing", desc: "Passwords are hashed using insecure, obsolete algorithms that are easily cracked using precomputed rainbow tables." },
                  { score: 10, severity: null }
                ]
              },
              "Q_NET_001": {
                category: "Network Security",
                options: [
                  { score: 0, severity: "critical", title: "Unencrypted Network Traffic", desc: "All client-server communications are sent in clear HTTP, exposing data to man-in-the-middle sniffing." },
                  { score: 4, severity: "warning", title: "Mixed HTTP/HTTPS Content", desc: "Partial HTTPS implementation allows cookie hijacking and insecure fallback vectors." },
                  { score: 10, severity: null }
                ]
              },
              "Q_API_002": {
                category: "API Security",
                options: [
                  { score: 0, severity: "critical", title: "Absent Server-side Input Validation", desc: "Trusting client-side validation allows attackers to bypass controls easily and execute SQL Injection/XSS." },
                  { score: 4, severity: "warning", title: "Weak Server-side Sanitization", desc: "Manual parameters checking leaves room for edge cases and injection vulnerabilities." },
                  { score: 10, severity: null }
                ]
              },
              "Q_CLOUD_001": {
                category: "Cloud Security",
                options: [
                  { score: 0, severity: "critical", title: "Hardcoded Code Credentials", desc: "Sensitive API keys and database strings are hardcoded directly in source code, easily leaked." },
                  { score: 2, severity: "critical", title: "Exposed Configuration Secrets", desc: "Environment secrets are committed to git repositories, exposing them to any user with source access." },
                  { score: 6, severity: "warning", title: "Local Secrets Exposure", desc: "Secrets are kept in plaintext files on servers, which can be leaked through filesystem traversal." },
                  { score: 10, severity: null }
                ]
              },
              "Q_DEP_001": {
                category: "Supply Chain",
                options: [
                  { score: 0, severity: "critical", title: "Vulnerable & Outdated Dependencies", desc: "Software packages are rarely updated, leaving known CVEs unpatched and exploitable." },
                  { score: 5, severity: "warning", title: "Irregular Package Patching", desc: "Dependencies are updated only reactively, leaving systems vulnerable to known exploits in the interim." },
                  { score: 10, severity: null }
                ]
              },
              "Q_BCP_001": {
                category: "Business Continuity",
                options: [
                  { score: 0, severity: "critical", title: "No System Backups", desc: "No backup system exists, putting all data at risk of permanent loss from ransomware or hardware failures." },
                  { score: 5, severity: "warning", title: "Untested Backups Restoration", desc: "Backups are created but never dry-run tested, risking corrupted backups during a real recovery emergency." },
                  { score: 10, severity: null }
                ]
              },
              "Q_DEV_003": {
                category: "Endpoint Security",
                options: [
                  { score: 0, severity: "critical", title: "Widespread Password Reuse", desc: "Reusing passwords means a single credential breach on a third-party site will compromise the primary system." },
                  { score: 3, severity: "warning", title: "Insecure Password Storage", desc: "Storing passwords in unencrypted files allows anyone with local access or simple malware to steal all credentials." },
                  { score: 10, severity: null }
                ]
              }
            };
            
            body.answers.forEach(ans => {
              const q = questionData[ans.questionId];
              if (q) {
                const opt = q.options[ans.selectedOptionIndex];
                if (opt) {
                  totalMax += 10;
                  totalObtained += opt.score;
                  
                  const category = q.category;
                  if (category === "Authentication") authScore = opt.score;
                  else if (category === "Data Protection") dataScore = opt.score;
                  else if (category === "Network Security") netScore = opt.score;
                  else if (category === "API Security") apiScore = opt.score;
                  else if (category === "Cloud Security") cloudScore = opt.score;
                  else if (category === "Supply Chain") supplyScore = opt.score;
                  else if (category === "Business Continuity") bcpScore = opt.score;
                  else if (category === "Endpoint Security") devScore = opt.score;
                  
                  if (opt.severity) {
                    calculatedFindings.push({
                      severity: opt.severity,
                      category: q.category,
                      title: opt.title,
                      description: opt.desc
                    });
                  }
                }
              }
            });
            
            if (totalMax > 0) {
              score = Math.round((totalObtained / totalMax) * 100);
            }
            
            if (score < 40) {
              calculatedRisk = "high";
              calculatedMaturity = "Beginner";
            } else if (score < 75) {
              calculatedRisk = "medium";
              calculatedMaturity = "Intermediate";
            } else {
              calculatedRisk = "low";
              calculatedMaturity = "Advanced";
            }
            
            calculatedFindings.sort((a, b) => {
              const sevOrder = { "critical": 3, "warning": 2, "low": 1 };
              return (sevOrder[b.severity] || 0) - (sevOrder[a.severity] || 0);
            });
          } else {
            calculatedFindings = [
              {
                severity: "critical",
                category: "Authentication",
                title: "Single-factor administrative logins",
                description: "Multi-Factor Authentication (MFA) is not enforced for all users, exposing administrative access to brute force and credential stuffing attacks."
              },
              {
                severity: "critical",
                category: "Cloud Security",
                title: "Exposed environment secrets",
                description: "Administrative credentials, API keys, and connection strings are stored inside plaintext environment configuration files that are easily exposed."
              },
              {
                severity: "warning",
                category: "Network Security",
                title: "Partial client-server encryption",
                description: "Communication between client and backend is partially using HTTP which allows eavesdropping and potential session hijacking."
              },
              {
                severity: "low",
                category: "API Security",
                title: "Basic input validation",
                description: "Backend inputs are validated manually instead of using strict schema validation libraries, leaving room for injection risks."
              }
            ];
          }

          const mockReport = {
            sessionId: "sess_12345678",
            overallScore: score,
            riskLevel: calculatedRisk,
            maturityLevel: calculatedMaturity,
            confidence: {
              confidenceScore: 88,
              confidenceLevel: "High",
              confidenceFactors: [
                "Highly consistent authentication questions answers",
                "Demonstrated mature understanding of Network and API controls",
                "Provided complete answers for the full questionnaire"
              ],
              contradictions: []
            },
            findings: calculatedFindings,
            categoryBreakdown: [
              { category: "Authentication", score: authScore },
              { category: "Data Protection", score: dataScore },
              { category: "Network Security", score: netScore },
              { category: "API Security", score: apiScore },
              { category: "Cloud Security", score: cloudScore },
              { category: "Supply Chain", score: supplyScore },
              { category: "Business Continuity", score: bcpScore },
              { category: "Endpoint Security", score: devScore }
            ],
            compliance: [
              {
                key: "gdpr",
                name: "GDPR Compliance Mapping",
                fullName: "General Data Protection Regulation (Regulation (EU) 2016/679)",
                complianceScore: score >= 80 ? 95 : score >= 50 ? 75 : 30,
                maxPenalty: "Up to €20,000,000 or 4% of annual global turnover, whichever is higher.",
                hardStopTriggered: false,
                requirements: [
                  { id: "R_GDPR_1", title: "Valid Consent Flow", article: "Article 7 - Conditions for consent", status: score >= 50 ? "met" : "not_met" },
                  { id: "R_GDPR_2", title: "Data Deletion / Right to Erasure", article: "Article 17 - Right to erasure ('right to be forgotten')", status: score >= 80 ? "met" : "partial" },
                  { id: "R_GDPR_3", title: "Data Portability", article: "Article 20 - Right to data portability", status: score >= 80 ? "met" : "not_met" }
                ]
              },
              {
                key: "pci_dss",
                name: "PCI-DSS v4.0 Scoping",
                fullName: "Payment Card Industry Data Security Standard",
                complianceScore: score >= 90 ? 90 : score >= 60 ? 60 : 25,
                maxPenalty: "Significant direct fines, merchant account suspension, and transactional transaction fee increases.",
                hardStopTriggered: score < 80,
                hardStopReason: "Failure to enforce MFA on remote access endpoints automatically triggers non-compliance status under Requirement 8.3.",
                requirements: [
                  { id: "R_PCI_1", title: "Strong Access Control Measures", article: "Requirement 8 - Identify and authenticate access to system components", status: score >= 80 ? "met" : "not_met" },
                  { id: "R_PCI_2", title: "Encrypt Cardholder Data Transmission", article: "Requirement 4 - Protect cardholder data with strong cryptography during transmission", status: score >= 60 ? "met" : "not_met" }
                ]
              }
            ],
            roadmap: {
              immediate: calculatedFindings.filter(f => f.severity === "critical").map(f => {
                let action = "Remediate Critical Vulnerability";
                let steps = ["Review configurations", "Enforce security controls"];
                if (f.category === "Authentication") {
                  action = "Enforce MFA across all administrative and user accounts";
                  steps = ["Enable conditional access policy inside your Identity Provider", "Notify users", "Set enforcement deadline"];
                } else if (f.category === "Cloud Security") {
                  action = "Migrate env secrets to AWS Secrets Manager / Vault";
                  steps = ["Provision secret store", "Replace .env references with dynamic retrieval", "Rotate keys"];
                } else if (f.category === "Network Security") {
                  action = "Enforce HTTP to HTTPS redirects globally";
                  steps = ["Configure permanent 301 redirects", "Include security headers"];
                }
                return {
                  action: action,
                  timeEstimate: "1-2 days",
                  difficulty: "Easy",
                  whyItMatters: f.description,
                  steps: steps,
                  links: ["https://owasp.org/"]
                };
              }),
              this_week: calculatedFindings.filter(f => f.severity === "warning").map(f => {
                return {
                  action: "Resolve Warning: " + f.title,
                  timeEstimate: "3-5 days",
                  difficulty: "Medium",
                  whyItMatters: f.description,
                  steps: ["Audit active occurrences", "Implement structural validation and patches"]
                };
              }),
              this_month: calculatedFindings.filter(f => f.severity === "low").map(f => {
                return {
                  action: "Address Low-risk issue: " + f.title,
                  timeEstimate: "1-2 weeks",
                  difficulty: "Easy",
                  whyItMatters: f.description,
                  steps: ["Incorporate into monthly sprint", "Validate with automated scanning tools"]
                };
              })
            }
          };

          if (url.includes('/submit') || url.includes('/analyze') || url.includes('/responses')) {
            localStorage.setItem('last_mock_report', JSON.stringify(mockReport));
            return {
              status: 200,
              data: { 
                success: true, 
                data: mockReport 
              }
            };
          }

          if (url.includes('/api/assessments/') && method === "GET") {
            let savedReport = localStorage.getItem('last_mock_report');
            if (savedReport) {
              try {
                return {
                  status: 200,
                  data: {
                    success: true,
                    data: JSON.parse(savedReport)
                  }
                };
              } catch(e) {}
            }
            return {
              status: 200,
              data: { 
                success: true, 
                data: mockReport 
              }
            };
          }
          
          return null; // Let original request handle it
        }

        var originalFetch = window.fetch;
        window.fetch = async function() {
          var arg = arguments[0];
          var url = '';
          var method = (arguments[1] && arguments[1].method) ? arguments[1].method.toUpperCase() : 'GET';
          var body = (arguments[1] && arguments[1].body) ? arguments[1].body : null;
          
          if (typeof arg === 'string') {
            url = arg;
          } else if (arg instanceof URL) {
            url = arg.href;
          } else if (arg && typeof arg === 'object' && arg.url) {
            url = arg.url;
            if (arg.method) method = arg.method.toUpperCase();
          }

          let parsedBody = null;
          if (body) {
            try {
              if (typeof body === 'string') parsedBody = JSON.parse(body);
            } catch(e) {}
          }

          if (url) {
             const mock = getMockResponse(url, method, parsedBody);
             if (mock) {
               return new Response(JSON.stringify(mock.data), { status: mock.status, headers: { 'Content-Type': 'application/json' } });
             }
          }
          return originalFetch.apply(this, arguments);
        };

        var originalXHR = window.XMLHttpRequest;
        function MockXHR() {
          var xhr = new originalXHR();
          var method, url;
          var proxy = {
            open: function(m, u) { method = m.toUpperCase(); url = u; xhr.open.apply(xhr, arguments); },
            send: function(body) {
              let parsedBody = null;
              if (body) {
                try {
                  if (typeof body === 'string') parsedBody = JSON.parse(body);
                } catch(e) {}
              }
              const mock = getMockResponse(url, method, parsedBody);
              if (mock) {
                Object.defineProperty(proxy, 'status', { value: mock.status });
                Object.defineProperty(proxy, 'readyState', { value: 4 });
                Object.defineProperty(proxy, 'responseText', { value: JSON.stringify(mock.data) });
                setTimeout(() => { if (proxy.onload) proxy.onload(); if (proxy.onreadystatechange) proxy.onreadystatechange(); }, 10);
                return;
              }
              xhr.send.apply(xhr, arguments);
            },
            setRequestHeader: function() { xhr.setRequestHeader.apply(xhr, arguments); }
          };
          for (var prop in xhr) { if (!(prop in proxy) && typeof xhr[prop] === 'function') proxy[prop] = xhr[prop].bind(xhr); }
          return proxy;
        }
        window.XMLHttpRequest = MockXHR;

        // Auto-clicker to bypass the login UI if it still shows up
        const observer = new MutationObserver((mutations) => {
            const emailInput = document.querySelector('input[type="email"]');
            const passInput = document.querySelector('input[type="password"]');
            const loginBtn = Array.from(document.querySelectorAll('button')).find(b => b.textContent.includes('Sign In') || b.textContent.includes('Login'));
            
            if (emailInput && passInput && loginBtn && !loginBtn.disabled && !window.hasAutoLogged) {
                window.hasAutoLogged = true;
                
                // Simulate React input events
                const nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
                nativeInputValueSetter.call(emailInput, 'auto@user.com');
                emailInput.dispatchEvent(new Event('input', { bubbles: true }));
                
                nativeInputValueSetter.call(passInput, 'password123');
                passInput.dispatchEvent(new Event('input', { bubbles: true }));
                
                setTimeout(() => {
                    const form = loginBtn.closest('form');
                    if (form) {
                        form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
                    } else {
                        loginBtn.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
                    }
                }, 100);
            }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>

  <body>
    <div id="root"></div>
  </body>
