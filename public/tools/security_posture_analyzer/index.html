<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posture Analyzer</title>
    <script type="module" crossorigin src="assets/index-BvAz94CA.js"></script>
    <link rel="stylesheet" crossorigin href="assets/index-BgZf7nrz.css">
    <script>
      (function() {
        // Force React Router to always start at root in the iframe
        window.history.replaceState(null, '', '/');

        // Auto-login by setting mock token
        localStorage.setItem('token', 'local_mock_token');
        sessionStorage.setItem('token', 'local_mock_token');
        localStorage.setItem('supabase.auth.token', JSON.stringify({currentSession: {access_token: 'mock'}}));

        function getMockResponse(url, method, body) {
          url = url.toString();
          method = method ? method.toUpperCase() : 'GET';
          
          if (url.includes('/auth/v1/token') || url.includes('/api/auth/login') || url.includes('sign-in') || url.includes('/api/auth/register')) {
            return {
              status: 200,
              data: { 
                success: true,
                access_token: "local_mock_token", 
                token: "local_mock_token",
                user: { id: "local", email: "user@example.com", name: "User", role: "user" } 
              }
            };
          }
          if (url.includes('/auth/v1/user') || url.includes('/api/auth/me')) {
            return {
              status: 200,
              data: { 
                success: true,
                data: { user: { id: "local", name: "User", role: "user" } },
                id: "local", email: "user@example.com", role: "authenticated", user: { id: "local", name: "User", role: "user" } 
              }
            };
          }
          
          if (url.includes('/api/assessments/start')) {
            const mockQuestions = [
              {
                id: "Q_AUTH_001",
                text: "How do users authenticate into your application?",
                category: "Authentication",
                options: [
                  { text: "No authentication — it is fully public" },
                  { text: "Username and password only" },
                  { text: "Username and password with optional MFA" },
                  { text: "MFA is enforced for all users" }
                ]
              },
              {
                id: "Q_DATA_001",
                text: "How is sensitive user data (like passwords) stored in your database?",
                category: "Data Protection",
                options: [
                  { text: "Plain text or simple encoding (e.g., Base64)" },
                  { text: "Hashed using old algorithms (MD5, SHA-1)" },
                  { text: "Hashed with modern algorithms (bcrypt, Argon2) and salted" }
                ]
              },
              {
                id: "Q_NET_001",
                text: "Is all communication between client and server encrypted?",
                category: "Network Security",
                options: [
                  { text: "No, it uses plain HTTP" },
                  { text: "Partial — some pages use HTTP, some HTTPS" },
                  { text: "Yes, HTTPS is strictly enforced with HSTS" }
                ]
              },
              {
                id: "Q_API_002",
                text: "How do you validate and sanitize user input on the backend?",
                category: "API Security",
                options: [
                  { text: "No validation — we trust client-side validation" },
                  { text: "Basic checks but no schema validation library" },
                  { text: "Strict schema validation (e.g., Zod, Joi) on all endpoints" }
                ]
              },
              {
                id: "Q_CLOUD_001",
                text: "How are secrets (API keys, DB connection strings) managed?",
                category: "Cloud Security",
                options: [
                  { text: "Hardcoded directly in source code" },
                  { text: "Stored in .env files committed to version control" },
                  { text: ".env files excluded from git, used locally" },
                  { text: "Dedicated secret manager (AWS Secrets Manager, HashiCorp Vault)" }
                ]
              },
              {
                id: "Q_DEP_001",
                text: "How often do you update your software dependencies?",
                category: "Supply Chain",
                options: [
                  { text: "Rarely or never" },
                  { text: "Occasionally, when a major issue is reported" },
                  { text: "Regularly with automated scanning tools (Snyk, Dependabot)" }
                ]
              },
              {
                id: "Q_BCP_001",
                text: "How is your critical data backed up?",
                category: "Business Continuity",
                options: [
                  { text: "No formal backup process" },
                  { text: "Automated backups, but never tested for recovery" },
                  { text: "Automated, off-site backups with regular restoration drills" }
                ]
              },
              {
                id: "Q_DEV_003",
                text: "How do you manage your passwords?",
                category: "Endpoint Security",
                options: [
                  { text: "I reuse the same password across multiple sites" },
                  { text: "I try to use different passwords but store them in a text file" },
                  { text: "I use a password manager (Bitwarden, 1Password, etc.)" }
                ]
              }
            ];

            return {
              status: 200,
              data: { 
                success: true, 
                data: { 
                  sessionId: "sess_" + Date.now(),
                  questionCount: mockQuestions.length,
                  questions: mockQuestions
                } 
              }
            };
          }
          
          if (url.includes('/rest/v1/')) {
            return {
              status: 200,
              data: [{
                 id: "1", score: 85, title: "Initial Assessment",
                 created_at: new Date().toISOString(),
                 details: { accessControl: 80, dataProtection: 90, networkSecurity: 85, incidentResponse: 80 }
              }]
            };
          }

          if (url.includes('api.groq.com') || url.includes('/functions/v1/') || url.includes('openai.com')) {
             const mockPlan = `## Analysis Complete\nYour security posture is generally good, but you need to enable MFA and secure your EU/UK data collection endpoints immediately to comply with GDPR.`;
             return {
               status: 200,
               data: {
                 choices: [{ message: { content: mockPlan } }],
                 success: true,
                 data: {
                     score: 75,
                     details: { accessControl: 80, dataProtection: 70, networkSecurity: 85, incidentResponse: 65 },
                     recommendations: ["Enable MFA on all critical accounts", "Implement regular data backups", "Use a password manager"]
                 }
               }
             };
          }

          if (url.includes('/submit') || url.includes('/analyze') || url.includes('/responses')) {
            return {
              status: 200,
              data: { 
                success: true, 
                data: { 
                  score: 75, 
                  details: { accessControl: 80, dataProtection: 70, networkSecurity: 85, incidentResponse: 65 },
                  recommendations: ["Enable MFA on all critical accounts", "Implement regular data backups", "Use a password manager"]
                } 
              }
            };
          }

          if (url.includes('/api/assessments/') && method === "GET") {
            return {
              status: 200,
              data: { 
                success: true, 
                data: { 
                  score: 75, 
                  details: { accessControl: 80, dataProtection: 70, networkSecurity: 85, incidentResponse: 65 },
                  recommendations: ["Enable MFA on all critical accounts", "Implement regular data backups"]
                } 
              }
            };
          }
          
          return null; // Let original request handle it
        }

        var originalFetch = window.fetch;
        window.fetch = async function() {
          var arg = arguments[0];
          var url = '';
          var method = (arguments[1] && arguments[1].method) ? arguments[1].method.toUpperCase() : 'GET';
          
          if (typeof arg === 'string') {
            url = arg;
          } else if (arg instanceof URL) {
            url = arg.href;
          } else if (arg && typeof arg === 'object' && arg.url) {
            url = arg.url;
            if (arg.method) method = arg.method.toUpperCase();
          }

          if (url) {
             const mock = getMockResponse(url, method);
             if (mock) {
               return new Response(JSON.stringify(mock.data), { status: mock.status, headers: { 'Content-Type': 'application/json' } });
             }
          }
          return originalFetch.apply(this, arguments);
        };

        var originalXHR = window.XMLHttpRequest;
        function MockXHR() {
          var xhr = new originalXHR();
          var method, url;
          var proxy = {
            open: function(m, u) { method = m.toUpperCase(); url = u; xhr.open.apply(xhr, arguments); },
            send: function(body) {
              const mock = getMockResponse(url, method, body);
              if (mock) {
                Object.defineProperty(proxy, 'status', { value: mock.status });
                Object.defineProperty(proxy, 'readyState', { value: 4 });
                Object.defineProperty(proxy, 'responseText', { value: JSON.stringify(mock.data) });
                setTimeout(() => { if (proxy.onload) proxy.onload(); if (proxy.onreadystatechange) proxy.onreadystatechange(); }, 10);
                return;
              }
              xhr.send.apply(xhr, arguments);
            },
            setRequestHeader: function() { xhr.setRequestHeader.apply(xhr, arguments); }
          };
          for (var prop in xhr) { if (!(prop in proxy) && typeof xhr[prop] === 'function') proxy[prop] = xhr[prop].bind(xhr); }
          return proxy;
        }
        window.XMLHttpRequest = MockXHR;

        // Auto-clicker to bypass the login UI if it still shows up
        const observer = new MutationObserver((mutations) => {
            const emailInput = document.querySelector('input[type="email"]');
            const passInput = document.querySelector('input[type="password"]');
            const loginBtn = Array.from(document.querySelectorAll('button')).find(b => b.textContent.includes('Sign In') || b.textContent.includes('Login'));
            
            if (emailInput && passInput && loginBtn && !loginBtn.disabled && !window.hasAutoLogged) {
                window.hasAutoLogged = true;
                
                // Simulate React input events
                const nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
                nativeInputValueSetter.call(emailInput, 'auto@user.com');
                emailInput.dispatchEvent(new Event('input', { bubbles: true }));
                
                nativeInputValueSetter.call(passInput, 'password123');
                passInput.dispatchEvent(new Event('input', { bubbles: true }));
                
                setTimeout(() => {
                    const form = loginBtn.closest('form');
                    if (form) {
                        form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
                    } else {
                        loginBtn.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
                    }
                }, 100);
            }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
