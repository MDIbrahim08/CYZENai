    <script>
      (function() {
        const originalFetch = window.fetch;
        window.fetch = async function() {
          const arg = arguments[0];
          const options = arguments[1] || {};
          let urlStr = '';
          if (typeof arg === 'string') {
            urlStr = arg;
          } else if (arg instanceof URL) {
            urlStr = arg.href;
          } else if (arg && arg.url) {
            urlStr = arg.url;
          }

          if (urlStr.includes('api.groq.com/openai/v1/chat/completions')) {
            try {
              let apiKey = window.localStorage.getItem('GROQ_API_KEY');
              if (!apiKey) {
                try { apiKey = window.parent.localStorage.getItem('GROQ_API_KEY'); } catch(e) {}
              }
              if (apiKey) {
                if (!options.headers) options.headers = {};
                
                if (options.headers instanceof Headers) {
                  options.headers.set('Authorization', 'Bearer ' + apiKey);
                } else if (typeof options.headers.set === 'function') {
                  options.headers.set('Authorization', 'Bearer ' + apiKey);
                } else {
                  options.headers['Authorization'] = 'Bearer ' + apiKey;
                }
              }
            } catch(e) {
              console.error('Error injecting API key:', e);
            }
          }
          return originalFetch.apply(this, arguments);
        };
      })();
