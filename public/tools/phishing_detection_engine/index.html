<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phishing Detection Engine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #05070a;
            color: #e2e8f0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(to right, #22d3ee, #8b5cf6, #22d3ee);
            -webkit-background-clip: text;
            color: transparent;
            background-size: 200%;
            animation: shine 5s linear infinite;
        }

        @keyframes shine { to { background-position: 200% center; } }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 16px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #0f1218;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Ambient glows */
        .container::before {
            content: '';
            position: absolute;
            top: -100px; left: -100px;
            width: 300px; height: 300px;
            background: rgba(34, 211, 238, 0.15);
            filter: blur(100px);
            z-index: 0; pointer-events: none;
        }
        
        .container > * { relative; z-index: 1; }

        textarea {
            width: 100%;
            height: 250px;
            padding: 20px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            resize: vertical;
            font-family: 'JetBrains Mono', monospace;
            color: #e2e8f0;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: #22d3ee;
            box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            background: #22d3ee;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -10px rgba(34, 211, 238, 0.5);
        }

        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(34, 211, 238, 0.4), 0 10px 10px -5px rgba(34, 211, 238, 0.2);
            filter: brightness(1.1);
        }
        button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; box-shadow: none; transform: none; }

        #result { margin-top: 40px; }

        .verdict-box {
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 24px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .verdict-PHISHING   { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); }
        .verdict-SUSPICIOUS { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); }
        .verdict-LIKELYSAFE { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); }
        .verdict-SAFE       { background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); }

        .verdict-title {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .verdict-PHISHING .verdict-title { color: #f87171; }
        .verdict-SUSPICIOUS .verdict-title { color: #fbbf24; }
        .verdict-LIKELYSAFE .verdict-title { color: #7dd3fc; }
        .verdict-SAFE .verdict-title { color: #4ade80; }

        .risk-score {
            font-size: 16px;
            margin-bottom: 16px;
            color: #cbd5e1;
            font-weight: 500;
        }
        .risk-score strong { color: #fff; }

        .summary {
            font-size: 16px;
            line-height: 1.6;
            color: #94a3b8;
        }

        .section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .section h3 {
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 700;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .flag-item {
            margin-bottom: 16px;
            padding: 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border-left: 4px solid #475569;
        }

        .flag-item.red { border-left-color: #ef4444; }
        .flag-item.warn { border-left-color: #f59e0b; }
        .flag-item.safe { border-left-color: #22c55e; }

        .flag-title {
            font-weight: 700;
            margin-bottom: 6px;
            font-size: 15px;
            color: #f8fafc;
        }

        .flag-detail {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
        }

        .what-to-do li {
            padding: 12px 0;
            font-size: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            list-style: none;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .what-to-do li::before {
            content: '→';
            color: #22d3ee;
            font-weight: bold;
        }
        .what-to-do li:last-child { border-bottom: none; padding-bottom: 0; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 20px 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-value { font-size: 32px; font-weight: 900; line-height: 1; }
        .stat-label { font-size: 13px; color: #94a3b8; margin-top: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

        .loading { text-align: center; color: #22d3ee; padding: 40px; font-size: 18px; font-weight: 600; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 50% { opacity: .5; } }
        .error-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 20px; border-radius: 16px; color: #fca5a5; text-align: center; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ Phishing Detection Engine</h1>
    <p class="subtitle">Paste the full content of any email below to check if it's a scam</p>

    <textarea id="emailInput" placeholder="Paste your full email content here..."></textarea>
    <button id="analyzeBtn" onclick="analyzeEmail()">🔍 Analyze Email</button>

    <div id="result"></div>
</div>

<script>
    async function analyzeEmail() {
        const emailText = document.getElementById('emailInput').value.trim();
        const resultDiv = document.getElementById('result');
        const btn       = document.getElementById('analyzeBtn');

        if (!emailText) {
            resultDiv.innerHTML = '<div class="error-box">⚠️ Please paste an email first.</div>';
            return;
        }

        btn.disabled     = true;
        btn.textContent  = '⏳ Analyzing...';
        resultDiv.innerHTML = '<div class="loading">Analyzing your email, please wait...</div>';

        try {
            // Simulate network delay
            await new Promise(resolve => setTimeout(resolve, 800));

            // Client-side heuristics
            const lowerText = emailText.toLowerCase();
            let score = 0;
            let red_flags = [];
            let warnings = [];
            let safe_signals = [];

            // 1. Urgency
            if (/(urgent|immediate|action required|suspended|blocked|limited time|verify now)/.test(lowerText)) {
                score += 35;
                red_flags.push({ flag: "Urgent Language", detail: "Scammers create a false sense of urgency so you act without thinking." });
            }

            // 2. Suspicious Links
            if (/(bit\.ly|t\.co|goo\.gl|tinyurl\.com|ow\.ly|is\.gd|click here|verify your account)/.test(lowerText)) {
                score += 30;
                red_flags.push({ flag: "Suspicious or Hidden Links", detail: "Contains URL shorteners or generic 'Click Here' links often used to hide malicious domains." });
            } else if (/https:\/\/[a-z0-9.-]+\.(com|org|net|edu|gov|io)/.test(lowerText)) {
                safe_signals.push({ flag: "Standard URL Format", detail: "Contains standard, transparent URLs." });
            }

            // 3. Sensitive Information Request
            if (/(password|ssn|social security|credit card|bank account|cvv|pin)/.test(lowerText)) {
                score += 40;
                red_flags.push({ flag: "Requests Sensitive Info", detail: "Legitimate organizations will rarely ask for your password or SSN via email." });
            }

            // 4. Generic Greetings
            if (/(dear customer|dear user|valued member|hello there|dear sir\/madam)/.test(lowerText)) {
                score += 15;
                warnings.push({ flag: "Generic Greeting", detail: "Legitimate companies usually address you by your real name." });
            }

            // 5. Poor Spelling / Grammar
            if (/(accountt|verifi|succesfully|payement|kindly|informations)/.test(lowerText)) {
                score += 15;
                warnings.push({ flag: "Poor Grammar/Spelling", detail: "Professional emails rarely contain obvious spelling mistakes." });
            }

            let verdict = "SAFE";
            let confidence = "High";
            let summary = "This email appears to be safe. No obvious phishing indicators were detected.";
            let what_to_do = ["You can safely interact with this email.", "Always remain cautious when clicking unexpected links."];

            if (score > 60) {
                verdict = "PHISHING";
                confidence = "High";
                summary = "Critical alert! This email exhibits strong characteristics of a phishing attack.";
                what_to_do = ["Do NOT click any links.", "Do NOT download any attachments.", "Mark this email as Spam or Phishing in your email client.", "Delete the email immediately."];
            } else if (score > 30) {
                verdict = "SUSPICIOUS";
                confidence = "Medium";
                summary = "Exercise caution. This email has several suspicious indicators.";
                what_to_do = ["Verify the sender's email address carefully.", "Do not click links; type the company's website directly into your browser.", "Contact the organization directly to verify the email's authenticity."];
            } else if (score > 0) {
                verdict = "LIKELY SAFE";
                confidence = "Low";
                summary = "This email is likely safe, but contains some minor warnings.";
                what_to_do = ["Ensure the sender's email address matches the company domain.", "Check links by hovering over them before clicking."];
            } else {
                safe_signals.push({ flag: "No Threat Signatures", detail: "Passed all heuristic checks without triggering threat rules." });
            }

            const analysis = {
                verdict,
                risk_score: Math.min(score, 100),
                confidence,
                summary,
                red_flags,
                warnings,
                safe_signals,
                what_to_do,
                stats: {
                    total_red_flags: red_flags.length,
                    total_warnings: warnings.length,
                    total_safe_signals: safe_signals.length
                }
            };

            renderResult(analysis);

        } catch (err) {
            resultDiv.innerHTML = `<div class="error-box">❌ An error occurred during analysis.</div>`;
            console.error(err);
        } finally {
            btn.disabled    = false;
            btn.textContent = '🔍 Analyze Email';
        }
    }

    function renderResult(a) {
        const verdictKey = a.verdict.replace(/\s/g, '');

        let html = `
        <!-- VERDICT BOX -->
        <div class="verdict-box verdict-${verdictKey}">
            <div class="verdict-title">${a.verdict}</div>
            <div class="risk-score">⚠️ Risk Score: <strong>${a.risk_score} / 100</strong> &nbsp;|&nbsp; Confidence: <strong>${a.confidence}</strong></div>
            <div class="summary">${a.summary}</div>
        </div>

        <!-- STATS -->
        <div class="section">
            <h3>📊 Quick Stats</h3>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" style="color:#ef4444">${a.stats.total_red_flags}</div>
                    <div class="stat-label">Red Flags</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" style="color:#f59e0b">${a.stats.total_warnings}</div>
                    <div class="stat-label">Warnings</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" style="color:#22c55e">${a.stats.total_safe_signals}</div>
                    <div class="stat-label">Safe Signals</div>
                </div>
            </div>
        </div>`;

        // RED FLAGS
        if (a.red_flags.length > 0) {
            html += `<div class="section">
                <h3>🚨 Red Flags (${a.red_flags.length})</h3>`;
            a.red_flags.forEach(f => {
                html += `<div class="flag-item red">
                    <div class="flag-title">${f.flag}</div>
                    <div class="flag-detail">${f.detail}</div>
                </div>`;
            });
            html += `</div>`;
        }

        // WARNINGS
        if (a.warnings.length > 0) {
            html += `<div class="section">
                <h3>⚠️ Warnings (${a.warnings.length})</h3>`;
            a.warnings.forEach(f => {
                html += `<div class="flag-item warn">
                    <div class="flag-title">${f.flag}</div>
                    <div class="flag-detail">${f.detail}</div>
                </div>`;
            });
            html += `</div>`;
        }

        // SAFE SIGNALS
        if (a.safe_signals.length > 0) {
            html += `<div class="section">
                <h3>✅ Safe Signals (${a.safe_signals.length})</h3>`;
            a.safe_signals.forEach(f => {
                html += `<div class="flag-item safe">
                    <div class="flag-title">${f.flag}</div>
                    <div class="flag-detail">${f.detail}</div>
                </div>`;
            });
            html += `</div>`;
        }

        // WHAT TO DO
        html += `<div class="section">
            <h3>📋 What Should You Do?</h3>
            <ul class="what-to-do">`;
        a.what_to_do.forEach(step => {
            html += `<li>${step}</li>`;
        });
        html += `</ul></div>`;

        document.getElementById('result').innerHTML = html;
    }
</script>

</body>
</html>
