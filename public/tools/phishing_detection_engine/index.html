<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phishing Detection Engine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 30px;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 15px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            font-family: monospace;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; }
        button:disabled { background: #93c5fd; cursor: not-allowed; }

        #result { margin-top: 30px; }

        .verdict-box {
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .verdict-PHISHING   { background: #fee2e2; border: 2px solid #ef4444; }
        .verdict-SUSPICIOUS { background: #fef3c7; border: 2px solid #f59e0b; }
        .verdict-LIKELYSAFE { background: #e0f2fe; border: 2px solid #38bdf8; }
        .verdict-SAFE       { background: #dcfce7; border: 2px solid #22c55e; }

        .verdict-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .risk-score {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .summary {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #e5e7eb;
        }

        .section h3 {
            margin-bottom: 15px;
            font-size: 17px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 8px;
        }

        .flag-item {
            margin-bottom: 14px;
            padding: 12px;
            border-radius: 6px;
            background: #f9fafb;
        }

        .flag-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 15px;
        }

        .flag-detail {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
        }

        .what-to-do li {
            padding: 8px 0;
            font-size: 14px;
            border-bottom: 1px solid #f3f4f6;
            list-style: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat-box {
            background: #f9fafb;
            border-radius: 6px;
            padding: 12px;
            text-align: center;
            border: 1px solid #e5e7eb;
        }

        .stat-value { font-size: 22px; font-weight: bold; }
        .stat-label { font-size: 12px; color: #666; margin-top: 4px; }

        .loading { text-align: center; color: #666; padding: 20px; font-size: 16px; }
        .error-box { background: #fee2e2; padding: 15px; border-radius: 8px; color: #b91c1c; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ Phishing Detection Engine</h1>
    <p class="subtitle">Paste the full content of any email below to check if it's a scam</p>

    <textarea id="emailInput" placeholder="Paste your full email content here..."></textarea>
    <button id="analyzeBtn" onclick="analyzeEmail()">🔍 Analyze Email</button>

    <div id="result"></div>
</div>

<script>
    async function analyzeEmail() {
        const emailText = document.getElementById('emailInput').value.trim();
        const resultDiv = document.getElementById('result');
        const btn       = document.getElementById('analyzeBtn');

        if (!emailText) {
            resultDiv.innerHTML = '<div class="error-box">⚠️ Please paste an email first.</div>';
            return;
        }

        btn.disabled     = true;
        btn.textContent  = '⏳ Analyzing...';
        resultDiv.innerHTML = '<div class="loading">Analyzing your email, please wait...</div>';

        try {
            const response = await fetch('http://localhost:5001/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email_text: emailText })
            });

            const data = await response.json();

            if (!data.success) {
                resultDiv.innerHTML = `<div class="error-box">❌ Error: ${data.error}</div>`;
                return;
            }

            renderResult(data.analysis);

        } catch (err) {
            resultDiv.innerHTML = `<div class="error-box">❌ Could not connect to the server. Is Flask running?</div>`;
        } finally {
            btn.disabled    = false;
            btn.textContent = '🔍 Analyze Email';
        }
    }

    function renderResult(a) {
        const verdictKey = a.verdict.replace(/\s/g, '');

        let html = `
        <!-- VERDICT BOX -->
        <div class="verdict-box verdict-${verdictKey}">
            <div class="verdict-title">${a.verdict}</div>
            <div class="risk-score">⚠️ Risk Score: <strong>${a.risk_score} / 100</strong> &nbsp;|&nbsp; Confidence: <strong>${a.confidence}</strong></div>
            <div class="summary">${a.summary}</div>
        </div>

        <!-- STATS -->
        <div class="section">
            <h3>📊 Quick Stats</h3>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" style="color:#ef4444">${a.stats.total_red_flags}</div>
                    <div class="stat-label">Red Flags</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" style="color:#f59e0b">${a.stats.total_warnings}</div>
                    <div class="stat-label">Warnings</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" style="color:#22c55e">${a.stats.total_safe_signals}</div>
                    <div class="stat-label">Safe Signals</div>
                </div>
            </div>
        </div>`;

        // RED FLAGS
        if (a.red_flags.length > 0) {
            html += `<div class="section">
                <h3>🚨 Red Flags (${a.red_flags.length})</h3>`;
            a.red_flags.forEach(f => {
                html += `<div class="flag-item">
                    <div class="flag-title">${f.flag}</div>
                    <div class="flag-detail">${f.detail}</div>
                </div>`;
            });
            html += `</div>`;
        }

        // WARNINGS
        if (a.warnings.length > 0) {
            html += `<div class="section">
                <h3>⚠️ Warnings (${a.warnings.length})</h3>`;
            a.warnings.forEach(f => {
                html += `<div class="flag-item">
                    <div class="flag-title">${f.flag}</div>
                    <div class="flag-detail">${f.detail}</div>
                </div>`;
            });
            html += `</div>`;
        }

        // SAFE SIGNALS
        if (a.safe_signals.length > 0) {
            html += `<div class="section">
                <h3>✅ Safe Signals (${a.safe_signals.length})</h3>`;
            a.safe_signals.forEach(f => {
                html += `<div class="flag-item">
                    <div class="flag-title">${f.flag}</div>
                    <div class="flag-detail">${f.detail}</div>
                </div>`;
            });
            html += `</div>`;
        }

        // WHAT TO DO
        html += `<div class="section">
            <h3>📋 What Should You Do?</h3>
            <ul class="what-to-do">`;
        a.what_to_do.forEach(step => {
            html += `<li>${step}</li>`;
        });
        html += `</ul></div>`;

        document.getElementById('result').innerHTML = html;
    }
</script>

</body>
</html>
